# cockpit/profiles/kharon.yaml —— Kharon（Zephyr）驾驶舱的唯一装配清单
#
# 物理拆分后驾驶舱只服务当前 Zephyr 工作区，不再有 classic 模式开关。
# 这里只保留三件事：工程可见范围、右列工作区顺序、工具启停。
#
# 激活：config/host.kharon.profile.yaml 顶层 `profile: kharon`。
profile: kharon
label: zephyr
desc: Kharon 链：Zephyr / west 单链工程
order: 20
workspaces:
  - arch
  - debug
  - build
  - dash
  - flash
  - serial
  - modbus
  - matrix
  - tools
projects:
  archetype:
    - zephyr
tools:
  include: []      # 空 = 全部启用
  exclude: []
