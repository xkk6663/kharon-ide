# cockpit/profiles/web.yaml —— 驾驶舱装配清单（R7 / P1-4）
#
# 装配两件事（其余能力仍由内核自描述 + 工程 yaml 派生）：
#   ① workspaces：右列 Tab 的顺序与集合（id 见 cockpit/web/src/workspaces.ts）；
#      留空 = 内置集合（build / flash / serial / tools）。
#   ② tools：项目声明工具（projects/*.yaml 的 tools:）的启停；
#      include 非空 = 只启用列出的工具，exclude 优先剔除。
#
# 激活顺序：ELAB_PROFILE → elab.host.yaml 的 `profile: <name>` → web.yaml → 排序第一份。
# 换一套装配 = 复制本文件改名并改上面两节；业务代码零改动。
#
# ★ 顶栏的模式开关（classic ⇄ Zephyr）渲染的就是本目录下**每一份**清单：
#   `label` 是按钮文案、`desc` 是悬停说明、`host` 是"切到这个模式要换哪份主机事实源"。
#   三者都是装配数据 —— 想并列第三个产品，加一份 yaml 即可，前端零改动。
profile: web
label: classic
desc: 原生链：STM32 CubeMX / AT32 / ESP-IDF 工程
host: elab.host.yaml
order: 10
# ★ Zephyr 专属工作区（dash / matrix / west）也列在这里 —— 它们对 classic 工程
#   由前端按 `archetype` 过滤掉（见 workspaces.ts 的 ZEPHYR_ONLY），
#   所以 classic 的导航宽度不变，Zephyr 工程才多出三页。
workspaces:
  - debug
  - build
  - dash
  - flash
  - serial
  - matrix
  - west
  - modbus
  - tools
tools:
  include: []      # 空 = 全部启用
  exclude: []
