name: kharon-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 本仓内核是纯 Python + 临时根目录夹具；不需要 Zephyr SDK / 探针即可跑测试。
    runs-on: windows-latest
    env:
      # windows runner 的控制台默认 charmap，Python 打印中文会 UnicodeEncodeError；
      # 脚本自身也做了 stdout.reconfigure，这里再兜住 pytest 及其子进程。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # 本仓没有 requirements.txt / pyproject.toml，依赖清单是 requirements-dev.txt。
          # 不显式指定时 setup-python 只找 **/requirements.txt 或 **/pyproject.toml，
          # 找不到会直接让该步骤失败（而非降级为不缓存）。
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt

      - name: Generated contracts guard
        run: node scripts/check-generated-contracts.mjs

      - name: APP boundary guard
        # 用仓库内最小 workspace 夹具跑真实脚本；完整工作区仍在本地按
        # `python scripts/app_boundary_check.py --root $env:ZEPHYR_ROOT` 检查。
        run: python scripts/app_boundary_check.py --root tests/fixtures/app_boundary_ws

      - name: Patch guard
        # 补丁守卫（zephyr 树脏改动必须恰好等于 patches/zephyr/*）。CI 里没有
        # 真实 Zephyr 工作区，所以用 tests/test_patch_guard.py 的临时根夹具跑
        # 三条判据；真实工作区仍按
        # `python scripts/patch_guard_check.py --root $env:ZEPHYR_ROOT` 本地检查。
        run: python -m pytest tests/test_patch_guard.py -q

      - name: Pytest
        shell: pwsh
        env:
          PYTHONPATH: services
        run: python -m pytest tests -q
