<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="460" fill="#fbfcfe"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0f172a">OTA 不是“覆盖写”：mcuboot 的双槽、试跑与回滚</text>
  <text x="24" y="52" font-size="12" fill="#64748b">升级只写候选槽；能不能留下，由“重启 + confirm”决定，不由上传成功决定</text>

  <rect x="24" y="82" width="196" height="120" rx="9" fill="#ffffff" stroke="#2563eb"/>
  <text x="40" y="106" font-size="11.5" font-weight="600" fill="#1d4ed8">当前运行 · slot0</text>
  <text x="40" y="130" font-size="10" fill="#475569">active / confirmed</text>
  <text x="40" y="148" font-size="10" fill="#475569">image_ok = 1</text>
  <text x="40" y="166" font-size="10" fill="#475569">回滚目标仍是它</text>
  <text x="40" y="188" font-size="9" fill="#94a3b8">旧固件，保留不擦</text>

  <path d="M220 142 L244 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="244" y="82" width="210" height="120" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="260" y="106" font-size="11.5" font-weight="600" fill="#b45309">上传 · slot1</text>
  <text x="260" y="130" font-size="10" fill="#475569">candidate / pending</text>
  <text x="260" y="148" font-size="10" fill="#475569">整包写入 + 校验 sha256</text>
  <text x="260" y="166" font-size="10" fill="#475569">不触碰 slot0</text>
  <text x="260" y="188" font-size="9" fill="#94a3b8">上传成功 ≠ 升级成功</text>

  <path d="M454 142 L478 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="478" y="82" width="240" height="120" rx="9" fill="#ecfdf5" stroke="#059669"/>
  <text x="494" y="106" font-size="11.5" font-weight="600" fill="#047857">重启 · mcuboot 试跑</text>
  <text x="494" y="130" font-size="10" fill="#475569">boot slot1（swap / test）</text>
  <text x="494" y="148" font-size="10" fill="#475569">串口/日志给出启动证据</text>
  <text x="494" y="166" font-size="10" fill="#475569">应用起来后调 confirm</text>
  <text x="494" y="188" font-size="9" fill="#94a3b8">没有 confirm = 下次回滚</text>

  <path d="M718 142 L742 142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="742" y="82" width="214" height="120" rx="9" fill="#ffffff" stroke="#2563eb"/>
  <text x="758" y="106" font-size="11.5" font-weight="600" fill="#1d4ed8">两种结局</text>
  <text x="758" y="130" font-size="10" fill="#047857">confirm → slot1 转正</text>
  <text x="758" y="148" font-size="10" fill="#b45309">失败/超时 → 回滚 slot0</text>
  <text x="758" y="166" font-size="10" fill="#475569">回滚后仍能串口启动</text>
  <text x="758" y="188" font-size="9" fill="#94a3b8">先保命，再谈新功能</text>

  <rect x="24" y="228" width="450" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="252" font-size="11.5" font-weight="600" fill="#0f172a">升级链路（本仓局域网 OTA）</text>
  <text x="40" y="276" font-size="10" fill="#475569">PC 浏览器 → Kharon OTA 页签 → HTTP 上传</text>
  <text x="40" y="294" font-size="10" fill="#475569">→ 设备写 slot1 → 校验 → 重启</text>
  <text x="40" y="312" font-size="10" fill="#475569">→ mcuboot 试跑 → 应用 confirm</text>
  <text x="40" y="330" font-size="10" fill="#475569">→ 串口打印版本 / slot / image_ok</text>
  <text x="40" y="354" font-size="9" fill="#94a3b8">不依赖云；同一局域网即可，适合实验室与产线</text>

  <rect x="490" y="228" width="466" height="150" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="506" y="252" font-size="11.5" font-weight="600" fill="#0f172a">验收四问（缺一不可）</text>
  <text x="506" y="276" font-size="10" fill="#475569">1. 上传后 <tspan font-weight="600">slot1</tspan> 真的有新 image？</text>
  <text x="506" y="294" font-size="10" fill="#475569">2. 重启后 <tspan font-weight="600">mcuboot 选了 slot1</tspan>？</text>
  <text x="506" y="312" font-size="10" fill="#475569">3. 应用起来后 <tspan font-weight="600">confirm 成功</tspan>？</text>
  <text x="506" y="330" font-size="10" fill="#475569">4. 故意不 confirm，<tspan font-weight="600">能回滚 slot0</tspan>？</text>
  <text x="506" y="354" font-size="9" fill="#94a3b8">第 4 问才是 OTA 的“安全气囊”，别只测 happy path</text>

  <rect x="24" y="394" width="932" height="36" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="40" y="417" font-size="10.5" fill="#047857">一句话：<tspan font-weight="600">上传只负责“把候选放进去”，重启负责“试”，confirm 负责“留下”，超时负责“回滚”。</tspan></text>

  <text x="24" y="452" font-size="9.5" fill="#94a3b8">口径：Zephyr 4.5.99 · mcuboot swap/test · 详见 tutorials/13 与 教程 17.5–17.7</text>
</svg>
