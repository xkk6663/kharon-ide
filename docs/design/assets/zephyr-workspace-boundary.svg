<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="640" fill="#fbfcfe"/>

  <text x="24" y="34" font-size="16" font-weight="600" fill="#0f172a">企业级 Zephyr 工作区边界：一个 workspace，两类根，三条生命周期</text>
  <text x="24" y="56" font-size="12" fill="#64748b">ELAB/kharon/ 下平级放 kharon-ide 与 zephyr-workspace；IDE 只消费工作区，不拥有 Zephyr 源码</text>

  <rect x="18" y="76" width="944" height="482" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="100" font-size="11" fill="#64748b">ELAB/kharon/</text>

  <!-- IDE -->
  <rect x="40" y="116" width="330" height="414" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="142" font-size="14" font-weight="600" fill="#1d4ed8">kharon-ide/</text>
  <text x="58" y="162" font-size="10.5" fill="#2563eb">自研 IDE：工具层 + 产品元数据</text>

  <rect x="58" y="180" width="294" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="202" font-size="11" fill="#334155">services/  cockpit/  tests/</text>

  <rect x="58" y="224" width="294" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="246" font-size="11" fill="#334155">packs/  providers/  docs/</text>

  <rect x="58" y="268" width="294" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="290" font-size="11" fill="#334155">host.local.yaml  kharon.cmd</text>

  <rect x="58" y="312" width="294" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="334" font-size="11" fill="#334155">.deps/  .kharon/（工具缓存 / 状态）</text>

  <text x="58" y="378" font-size="10.5" fill="#475569">不拥有：zephyr/、boards/、apps/、build/</text>
  <text x="58" y="398" font-size="10.5" fill="#475569">packs/providers 是 IDE 适配器，不是 Zephyr 源码</text>

  <rect x="58" y="430" width="294" height="78" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="72" y="452" font-size="10.5" fill="#1d4ed8" font-weight="600">只读入口</text>
  <text x="72" y="472" font-size="10.5" fill="#1e3a8a">kharon ws / run / monitor / cockpit</text>
  <text x="72" y="492" font-size="10.5" fill="#1e3a8a">通过 IDE_ROOT + ZEPHYR_ROOT 组合路径</text>

  <!-- workspace -->
  <rect x="430" y="116" width="508" height="414" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="448" y="142" font-size="14" font-weight="600" fill="#047857">zephyr-workspace/</text>
  <text x="448" y="162" font-size="10.5" fill="#059669">west workspace（可整目录删除重建，本身不是 Git 仓）</text>

  <rect x="448" y="180" width="472" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="460" y="201" font-size="11" fill="#334155" font-weight="600">kharon-manifest/  ·  west.yml + products/</text>
  <text x="460" y="220" font-size="10" fill="#64748b">版本清单 + 产品绑定：Zephyr commit + 板级 + APP + HAL allowlist</text>

  <rect x="448" y="242" width="226" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="460" y="263" font-size="11" fill="#334155" font-weight="600">zephyr/  modules/  tools/</text>
  <text x="460" y="282" font-size="10" fill="#64748b">上游，只读；west update 管理</text>

  <rect x="694" y="242" width="226" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="706" y="263" font-size="11" fill="#334155" font-weight="600">.west/</text>
  <text x="706" y="282" font-size="10" fill="#64748b">生成；不入库</text>

  <rect x="448" y="304" width="226" height="118" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="460" y="325" font-size="11" fill="#334155" font-weight="600">kharon-boards/</text>
  <text x="460" y="344" font-size="10" fill="#64748b">板级工作区（独立 module 仓）</text>
  <text x="460" y="362" font-size="10" fill="#64748b">zephyr/module.yml</text>
  <text x="460" y="380" font-size="10" fill="#64748b">boards/&lt;vendor&gt;/&lt;board&gt;/</text>
  <text x="460" y="398" font-size="10" fill="#64748b">dts/bindings · drivers · soc · doc</text>
  <text x="460" y="416" font-size="9.5" fill="#047857">elab-app-common 与它平级</text>

  <rect x="694" y="304" width="226" height="118" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="706" y="325" font-size="11" fill="#334155" font-weight="600">applications/</text>
  <text x="706" y="344" font-size="10" fill="#64748b">APP 工作区（可一个仓多 APP）</text>
  <text x="706" y="362" font-size="10" fill="#64748b">CMakeLists · prj.conf · src</text>
  <text x="706" y="380" font-size="10" fill="#64748b">boards/&lt;target&gt;.overlay</text>
  <text x="706" y="398" font-size="10" fill="#64748b">只放 APP 级差异，不放板级真相</text>

  <rect x="448" y="434" width="226" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="460" y="455" font-size="11" fill="#334155" font-weight="600">kharon-manifest/products/</text>
  <text x="460" y="474" font-size="10" fill="#64748b">APP × 板 × 串口判据 / 产物</text>

  <rect x="694" y="434" width="226" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="706" y="455" font-size="11" fill="#334155" font-weight="600">build/</text>
  <text x="706" y="474" font-size="10" fill="#64748b">生成；不入库</text>

  <text x="448" y="516" font-size="10.5" fill="#047857">内部每个子目录都可以是独立 Git 仓；workspace 只负责组合与版本</text>

  <!-- arrows -->
  <path d="M352 470 L420 470" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
  <text x="386" y="456" font-size="9.5" fill="#2563eb" text-anchor="middle">路径</text>

  <path d="M430 360 L360 360" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="395" y="346" font-size="9.5" fill="#059669" text-anchor="middle">实际源码</text>

  <!-- forbidden -->
  <path d="M360 530 L448 530" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>
  <text x="404" y="518" font-size="9.5" fill="#dc2626" text-anchor="middle">禁止写入上游树</text>
  <text x="404" y="552" font-size="9.5" fill="#dc2626" text-anchor="middle">不要放 zephyr/boards/</text>

  <text x="24" y="600" font-size="12" fill="#0f172a" font-weight="600">红线：IDE 不拥有 Zephyr 源码；工作区不依赖 IDE；板级真相只进 kharon-boards</text>
  <text x="24" y="620" font-size="11" fill="#64748b">发布单元 = kharon-manifest@tag + kharon-boards@tag + app@tag + SDK profile；一个 tag 可重建整棵工作区</text>
</svg>
