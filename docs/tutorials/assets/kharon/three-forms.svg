<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/>
    </marker>
  </defs>

  <style>
    .t-dark { fill: #232a33; }
    .t-mut  { fill: #5a6472; }
    .t-acc  { fill: #1f6f43; }
    .box    { fill: #ffffff; stroke: #c9d1d9; stroke-width: 1; rx: 8; }
    .box-hl { fill: #f2fbf6; stroke: #1f6f43; stroke-width: 1.4; }
    .lane   { fill: #f6f8fa; stroke: #e3e8ee; }
    .line   { stroke: #5a6472; stroke-width: 1.2; fill: none; }
    .mono   { font-family: Consolas, 'Courier New', monospace; }
  </style>

  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="24" y="34" class="t-dark" font-size="17" font-weight="700">三形态 × 双拓扑：elab 怎么决定去哪儿构建</text>
  <text x="24" y="56" class="t-mut">探测只读文件系统（.west/config / board.yml / 工程根），零 west 调用</text>

  <!-- 左列：两个探测问题 -->
  <rect x="24" y="84" width="180" height="70" class="lane" rx="8"/>
  <text x="36" y="108" class="t-dark" font-weight="700">① 拓扑（双拓扑）</text>
  <text x="36" y="128" class="t-mut">清单仓在哪？</text>
  <text x="36" y="146" class="mono t-mut">.west/config → manifest</text>

  <rect x="24" y="180" width="180" height="70" class="lane" rx="8"/>
  <text x="36" y="204" class="t-dark" font-weight="700">② 形态（三形态）</text>
  <text x="36" y="224" class="t-mut">应用在哪？</text>
  <text x="36" y="242" class="mono t-mut">工程 root vs 工作区</text>

  <!-- 决策箭头 -->
  <line x1="204" y1="119" x2="252" y2="150" class="line" marker-end="url(#arr)"/>
  <line x1="204" y1="215" x2="252" y2="185" class="line" marker-end="url(#arr)"/>

  <!-- 中间：WorkspaceFacts -->
  <rect x="254" y="120" width="140" height="110" class="box-hl" rx="8"/>
  <text x="266" y="144" class="t-acc" font-weight="700">WorkspaceFacts</text>
  <text x="266" y="164" class="mono t-dark" font-size="12">topology: t1/t2/t3</text>
  <text x="266" y="182" class="mono t-dark" font-size="12">app_role: repo/</text>
  <text x="266" y="198" class="mono t-dark" font-size="12">  workspace/standalone</text>
  <text x="266" y="216" class="mono t-dark" font-size="12">west_usable / cmake_usable</text>

  <!-- 右列：三条构建链 -->
  <rect x="440" y="84" width="216" height="70" class="box" rx="8"/>
  <text x="452" y="106" class="t-dark" font-weight="700">仓库应用（repo）</text>
  <text x="452" y="124" class="mono t-mut" font-size="12">west build … samples/hello_world</text>
  <text x="452" y="142" class="mono t-mut" font-size="12">cwd = zephyr_base</text>

  <rect x="440" y="170" width="216" height="70" class="box" rx="8"/>
  <text x="452" y="192" class="t-dark" font-weight="700">工作区应用（workspace）</text>
  <text x="452" y="210" class="mono t-mut" font-size="12">west build … applications/app</text>
  <text x="452" y="228" class="mono t-mut" font-size="12">cwd = topdir</text>

  <rect x="440" y="256" width="216" height="70" class="box" rx="8"/>
  <text x="452" y="278" class="t-dark" font-weight="700">独立应用（standalone）</text>
  <text x="452" y="296" class="mono t-mut" font-size="12">west build … ${root}（绝对路径）</text>
  <text x="452" y="314" class="mono t-mut" font-size="12">cwd = topdir；本仓工程走这条</text>

  <line x1="394" y1="145" x2="438" y2="119" class="line" marker-end="url(#arr)"/>
  <line x1="394" y1="172" x2="438" y2="205" class="line" marker-end="url(#arr)"/>
  <line x1="394" y1="205" x2="438" y2="291" class="line" marker-end="url(#arr)"/>

  <!-- 降级链 -->
  <rect x="440" y="342" width="216" height="56" class="lane" rx="8"/>
  <text x="452" y="364" class="t-dark" font-weight="700">降级：无工作区 + 有 ZEPHYR_BASE</text>
  <text x="452" y="384" class="mono t-mut" font-size="12">cmake -S/-B → cmake --build（post_cmd）</text>

  <line x1="548" y1="326" x2="548" y2="340" class="line" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  <text x="560" y="338" class="t-mut" font-size="11">when_no_workspace: native-cmake</text>
</svg>
