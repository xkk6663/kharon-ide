<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#fbfcfe"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#0f172a">Kharon 单链：一条命令，一份内核，四层事实源</text>
  <text x="24" y="52" font-size="12" fill="#64748b">本仓只保留 Zephyr 产品线；CLI 与 standalone cockpit 共用同一套内核状态与 HTTP ICD</text>

  <!-- 入口 -->
  <rect x="24" y="74" width="272" height="206" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="96" font-size="11" fill="#64748b">入口（人敲的命令）</text>

  <rect x="40" y="108" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="129" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">kharon.cmd</text>
  <text x="160" y="147" font-size="10.5" fill="#2563eb" text-anchor="middle">Zephyr 专属 · 唯一产品入口</text>

  <rect x="40" y="170" width="112" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="190" font-size="10.5" fill="#475569" text-anchor="middle">bootstrap / ws</text>
  <rect x="160" y="170" width="120" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="220" y="190" font-size="10.5" fill="#475569" text-anchor="middle">adapt / list</text>
  <rect x="40" y="208" width="112" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="228" font-size="10.5" fill="#475569" text-anchor="middle">run -p &lt;name&gt;</text>
  <rect x="160" y="208" width="120" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="220" y="228" font-size="10.5" fill="#475569" text-anchor="middle">monitor / cockpit</text>
  <text x="160" y="263" font-size="10" fill="#64748b" text-anchor="middle">同一入口也可直接 python -m elab</text>

  <!-- 内核 -->
  <rect x="316" y="74" width="300" height="206" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="332" y="96" font-size="11" fill="#2563eb">一份内核 services/elab（不复制、不分叉）</text>

  <rect x="332" y="108" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="396" y="130" font-size="11" fill="#1e40af" text-anchor="middle">plan / flow</text>
  <rect x="472" y="108" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="536" y="130" font-size="11" fill="#1e40af" text-anchor="middle">run</text>
  <rect x="332" y="150" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="396" y="172" font-size="11" fill="#1e40af" text-anchor="middle">build / flash</text>
  <rect x="472" y="150" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="536" y="172" font-size="11" fill="#1e40af" text-anchor="middle">serial / debug</text>
  <rect x="332" y="192" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="396" y="214" font-size="11" fill="#1e40af" text-anchor="middle">provider</text>
  <rect x="472" y="192" width="128" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="536" y="214" font-size="11" fill="#1e40af" text-anchor="middle">workspace</text>
  <text x="466" y="256" font-size="10" fill="#64748b" text-anchor="middle">cockpit/server.py 暴露同一份状态（loopback HTTP ICD）</text>

  <!-- 装配数据 -->
  <rect x="632" y="74" width="324" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="648" y="96" font-size="11" fill="#64748b">装配数据（唯一允许分叉的地方）</text>

  <rect x="648" y="108" width="140" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="718" y="129" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">kharon-manifest</text>
  <text x="718" y="147" font-size="9.5" fill="#94a3b8" text-anchor="middle">app · board · 产物 · 判据</text>

  <rect x="800" y="108" width="140" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="870" y="129" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">host.kharon + local</text>
  <text x="870" y="147" font-size="9.5" fill="#94a3b8" text-anchor="middle">SDK · west · 工具绝对路径</text>

  <rect x="648" y="170" width="140" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="718" y="191" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">providers/zephyr</text>
  <text x="718" y="209" font-size="9.5" fill="#94a3b8" text-anchor="middle">命令模板 · env · 产物</text>

  <rect x="800" y="170" width="140" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="870" y="191" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">packs/zephyr</text>
  <text x="870" y="209" font-size="9.5" fill="#94a3b8" text-anchor="middle">框架 · 板名映射 · 坑位</text>

  <text x="794" y="256" font-size="10" fill="#64748b" text-anchor="middle">本机路径只进 host.local.yaml（gitignored）</text>

  <!-- 应用与工作区 -->
  <rect x="24" y="322" width="440" height="214" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="40" y="344" font-size="11" fill="#2563eb">应用与工作区（clone 后即可开发）</text>

  <rect x="40" y="356" width="196" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="138" y="377" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">applications/&lt;family&gt;/&lt;app&gt;</text>
  <text x="138" y="396" font-size="10" fill="#3b82f6" text-anchor="middle">freestanding app（独立可编译）</text>

  <rect x="252" y="356" width="196" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="377" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">kharon-boards/</text>
  <text x="350" y="396" font-size="10" fill="#3b82f6" text-anchor="middle">elab-boards · elab-app-common</text>

  <rect x="40" y="428" width="196" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="138" y="449" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">zephyr-workspace/</text>
  <text x="138" y="468" font-size="10" fill="#3b82f6" text-anchor="middle">Zephyr 4.5.99 + HAL + 板级 dts</text>

  <rect x="252" y="428" width="196" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="449" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">build/&lt;arch&gt;/&lt;project&gt;/</text>
  <text x="350" y="468" font-size="10" fill="#3b82f6" text-anchor="middle">zephyr.elf + runners.yaml</text>

  <text x="244" y="514" font-size="10" fill="#64748b" text-anchor="middle">外来工程不搬家：kharon adapt &lt;dir&gt; --write 只登记，不改它的 CMake</text>

  <!-- 闭环结果 -->
  <rect x="496" y="322" width="460" height="214" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="344" font-size="11" fill="#64748b">闭环与证据（每一步都有产物）</text>

  <rect x="512" y="356" width="204" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="614" y="378" font-size="10.5" fill="#047857" text-anchor="middle">doctor → build → flash</text>
  <rect x="732" y="356" width="208" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="836" y="378" font-size="10.5" fill="#047857" text-anchor="middle">monitor（1Hz alive 判据）</text>

  <rect x="512" y="402" width="204" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="614" y="424" font-size="10.5" fill="#047857" text-anchor="middle">debug（GDB / Zephyr 内核态）</text>
  <rect x="732" y="402" width="208" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="836" y="424" font-size="10.5" fill="#047857" text-anchor="middle">cockpit（人看同一份状态）</text>

  <rect x="512" y="454" width="428" height="60" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="726" y="476" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">判据只看事实：日志 / 产物 / 串口帧 / 停止位置 / 审计事件</text>
  <text x="726" y="496" font-size="10" fill="#475569" text-anchor="middle">不抄 dts / Kconfig 的 memory·core —— 避免第二套构建真相</text>

  <!-- 连线 -->
  <path d="M296 160 L316 160" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
  <path d="M616 160 L632 160" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-green)"/>
  <path d="M466 280 L410 322" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-blue)"/>
  <path d="M794 280 L760 322" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <path d="M464 428 L496 428" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
</svg>
