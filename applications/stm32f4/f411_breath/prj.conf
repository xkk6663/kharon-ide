# f411_breath 的最小 Kconfig：只开"能跑起来 + 能看见"的几项，其余留空。
# 每加一项都要能说清为什么（见 docs\教程\15-Zephyr跨芯片\换芯片实战-STM32F411.md 第 8 节）。

# 控制台 = 串口（USART1 → PA9/PA10 → DAP-Link 的 CDC 串口）
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# LED / 按键都走 GPIO 驱动（不启用 input 子系统，按键在 1 kHz 帧里轮询）
CONFIG_GPIO=y

# printk 每次都同步写 UART，栈按惯例给足
CONFIG_MAIN_STACK_SIZE=2048

# ★ 调试会话必须开这一项（2026-11-18 实机踩到）：
#   不开时 continue 之后 openocd 立刻"Polling failed / Failed to read memory at
#   0xe000ed04"，gdb 报 signal-received、pc=0，看起来像固件崩了——其实固件在正常
#   跑（串口心跳照旧）。根因是 WFI/STOP 期间内核时钟被门控，AHB-AP 读不到内核
#   寄存器；CONFIG_DEBUG 让 SoC 初始化时置 DBGMCU_CR 的 DBG_SLEEP/STOP/STANDBY
#   冻结位，低功耗态下调试口仍可访问。
CONFIG_DEBUG=y
