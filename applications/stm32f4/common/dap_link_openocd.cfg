# DAP-Link（CMSIS-DAP）→ STM32F4 的 OpenOCD 配置（本仓库 app 级覆盖）
#
# 为什么需要这个文件：
#   zephyr\boards\weact\blackpill_f411ce\support\openocd.cfg 是给 ST-Link 写的
#   （source [find interface/stlink-dap.cfg]），手上是 DAP-Link，接口层必须换；
#   目标层（target/stm32f4x.cfg）是 OpenOCD 自带的，不用改。
#
# 用法：west flash -d <构建目录> --runner openocd --config <本文件>

source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]

# 只接了 SWDIO/SWCLK/GND/3V3（没接 nRST）时用 none：
# 复位走 CM4 的 SYSRESETREQ，不依赖复位线。
# 如果接了 nRST，可以改成：reset_config srst_only srst_nogate
reset_config none
