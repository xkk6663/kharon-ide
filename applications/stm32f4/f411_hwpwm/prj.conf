#
# f411_hwpwm 的最小 Kconfig：比 f411_breath 只多一个 CONFIG_PWM。
# 板级 dts 已经给了 &timers4 { pwm4: pwm { tim4_ch1_pb6 / tim4_ch2_pb7 } }，
# 所以这里既不用改 dts，也不用写 overlay —— 只把驱动打开。

# 控制台 = 串口（USART1 → PA9/PA10 → DAP-Link 的 CDC 串口）
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# 硬件 PWM：TIM4 的 CH1/CH2 出 PB6/PB7
CONFIG_PWM=y

# 按键 PA0 仍走 GPIO（1 kHz 轮询 + 20 帧去抖）
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=2048
