# f411_modbus 的 Kconfig：只用「Zephyr 已有的东西」，不引第三方库。
#
# 与 f411_breath 的差别只有两处：
#   ① 打开 Modbus 子系统（server 角色）；
#   ② 关掉 LOG，只留 printk —— 因为 USART1 在 modbus_init_server 之后归协议栈，
#      任何异步日志都会把 Modbus 帧撞碎（见教程 11 §5）。

# 控制台 = USART1（PA9/PA10 → DAP-Link CDC）。开机自检要用它，
# 协议起来之后就不再打印（单口方案，和 classic 的 STM32F411_modbus 一致）。
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Modbus 走 UART 中断：RTU 的 3.5 字符静默定界靠 IRQ + 超时，不走轮询
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=n
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y

# ★ 关日志：LOG 在中断里也能输出，会和 Modbus 帧抢同一个 UART
CONFIG_LOG=n
CONFIG_PRINTK=y

CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048

# 调试会话：不开这一项时，主循环 WFI 期间 AHB-AP 读不到内核寄存器，
# openocd 会刷 "Polling failed / Failed to read memory at 0xe000ed04"，
# gdb 报 pc=0（看起来像崩了，其实固件在正常跑）。详见教程 10 §5.1。
CONFIG_DEBUG=y
