# DAP-Link（CMSIS-DAP）→ STM32F1 的 OpenOCD 配置（本仓库 app 级覆盖）
#
# 为什么需要这个文件：
#   zephyr\boards\others\stm32f103_mini\board.cmake 里给的是 ST-Link 的默认配置
#   （interface/stlink.cfg），手上是 DAP-Link，接口层必须换；
#   目标层换成 OpenOCD 自带的 target/stm32f1x.cfg（F1 系列）。
#
# 用法：west flash -d <构建目录> --runner openocd --config <本文件>
#       （平时直接用 .\tools\build.ps1 -App .\applications\stm32f1\f103_breath -Board stm32f103_mini -Flash）

source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f1x.cfg]

# 只接了 SWDIO/SWCLK/GND/3V3（没接 nRST）时用 none：
# 复位走 CM3 的 SYSRESETREQ（VECTRESET 视 provider 而定），不依赖复位线。
# 如果接了 nRST，可以改成：reset_config srst_only srst_nogate
reset_config none
