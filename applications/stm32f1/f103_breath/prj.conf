#
# f103_breath 的最小 Kconfig：只要"能跑起来 + 能看见"的几项。
# 每加一项都要能说清为什么（见 docs\教程\15-Zephyr跨芯片\换芯片实战-STM32F103.md 第 8 节）。

# 控制台 = 串口（USART1 → PA9/PA10 → DAP-Link 的 CDC 串口）
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# LED 走 GPIO 驱动（Blue Pill 没有用户按键，本工程不做按键）
CONFIG_GPIO=y

# printk 每次同步写 UART，栈按惯例给足
CONFIG_MAIN_STACK_SIZE=2048
