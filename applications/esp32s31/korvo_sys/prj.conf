# 系统层：复位原因 / 片上温度 / 硬件随机数 / 看门狗
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# 四件事各自的最小依赖
CONFIG_HWINFO=y              # 复位原因、器件 ID（hwinfo_esp32 默认 y）
CONFIG_SENSOR=y              # 片上温度（coretemp 节点要在 overlay 打开）
CONFIG_ENTROPY_GENERATOR=y   # 硬件 RNG（trng0 已在板级 dts okay）
# 看门狗的总开关在这棵树里叫 WATCHDOG（不是 WDT，写 CONFIG_WDT=y 会报"未定义符号"）。
# Kconfig: menuconfig WATCHDOG → if WATCHDOG 包住整个 drivers/watchdog/Kconfig.esp32，
# 所以不打开 WATCHDOG，WDT_ESP32 的 default y 也不会生效。
# 本工程只读 device_is_ready，不安装超时（安装后停止喂狗会复位板子）。
CONFIG_WATCHDOG=y

# 硬件加密（AES / SHA）：drivers/crypto/Kconfig 整个文件被 `if CRYPTO` 包住，
# 所以不打开 CRYPTO，CRYPTO_ESP32 的 default y 也不会生效 → 设备不会实例化，
# 链接期直接报 undefined reference to `__device_dts_ord_46`（aes）/`_71`（sha）。
CONFIG_CRYPTO=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
