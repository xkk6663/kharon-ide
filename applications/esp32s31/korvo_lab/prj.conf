# 阶段 3：驱动实机实验（GPIO / I2C / ADC / WS2812）
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y

# WS2812 走 RMT（pulse_io）
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_PULSE_IO=y

# 第 3 项：PWM（LEDC0 通道0 → GPIO26）
CONFIG_PWM=y

# 第 6 项：CAN / TWAI（板载 twai0；S31 的 binding 是 esp32-twaifd，不是 esp32-twai）
CONFIG_CAN=y
CONFIG_CAN_ESP32_TWAIFD=y

# 第 1 项：按键走 input 子系统。
# adc-keys 驱动自己是 default y（节点一进树就编），但 INPUT 子系统不会自动开，
# 漏了这一行就是链接期 undefined reference。
CONFIG_INPUT=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=2560
CONFIG_HEAP_MEM_POOL_SIZE=8192
