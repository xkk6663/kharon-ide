# korvo_periph —— 应用层七项实操台
# 只开"用户态能开"的开关：驱动由 devicetree 里的 status="okay" 自动选中。

# --- 控制台 / shell ---
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=6144

CONFIG_LOG=y
# 1 = error：adc_esp32 每次采样都会打 "uncompensated" 警告，会把串口刷满
CONFIG_LOG_DEFAULT_LEVEL=1

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- ① ADC 四键（IO42 = ADC1_CH0）---
CONFIG_ADC=y

# --- ② WS2812（IO37，RMT OUT0）---
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_PULSE_IO=y

# --- ③ PWM（LEDC0）---
CONFIG_PWM=y

# --- ⑤ I2C（板载 ES8389 挂在 0x10 / 0x14）---
CONFIG_I2C=y

# --- ⑥ CAN / TWAI（内部回环自测，不需要收发器）---
CONFIG_CAN=y
