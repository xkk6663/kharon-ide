# 应用层：RGB 动画引擎 + 功放联动
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_PULSE_IO=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
# 只保留 error：adc_esp32 每次采样都会打 uncompensated 警告，会把串口刷满
CONFIG_LOG_DEFAULT_LEVEL=1

# --- NVS 持久化（记住模式/基色/亮度/功放）---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# --- 按键输入（input 子系统）---
# S31 的上游板级里已经有 gpio_keys/boot_button（别名 sw0），
# 代码里的 HAS_KEY 因此为真、会编进 input 回调与 input_report；
# 但 CONFIG_INPUT 只有在 S3 的 boards\*.conf 里开过，S31 这边漏了 ->
# 链接期会报 `undefined reference to __device_dts_ord_19` / `input_report`。
# 打开 INPUT 后 gpio-keys 驱动由 DT_HAS_GPIO_KEYS_ENABLED 自动选中（INPUT_GPIO_KEYS=y）。
CONFIG_INPUT=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
