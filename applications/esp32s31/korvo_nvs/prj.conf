# korvo_nvs —— 持久化实验台
# 依赖链：NVS ← FLASH + FLASH_PAGE_LAYOUT；PARTITION_DEVICE 宏来自 FLASH_MAP

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# --- 存储三件套 ---
CONFIG_FLASH=y                 # flash 驱动框架（DT 有 flash-controller 就自动选驱动）
CONFIG_FLASH_MAP=y             # PARTITION_DEVICE / PARTITION_OFFSET
CONFIG_FLASH_PAGE_LAYOUT=y     # flash_get_page_info_by_offs（NVS 要知道扇区=page）
CONFIG_NVS=y                   # 本树路径 subsys/kvss/nvs，头文件 <zephyr/kvss/nvs.h>

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
