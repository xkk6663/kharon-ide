# ⚠️ 这个文件在当前这版 Zephyr 树里**不生效**，保留它只是为了不再有人被它误导。
#
# 为什么会以为它生效：sysbuild 有"读 app 目录下 mcuboot.conf"的约定。
# 实测这棵树没有把它接进去：
#   build/esp32s3/s3ota/mcuboot/CMakeCache.txt 里
#   CONF_FILE = bootloader/mcuboot/boot/zephyr/prj.conf ; .../socs/esp32s3_procpu.conf
#   —— 我们的 mcuboot.conf 不在这个列表里。
# 而且 sysbuild 会用 FORCED_CONF_FILE 强制写入
#   build/esp32s3/s3ota/mcuboot/zephyr/.config.sysbuild
#   （CONFIG_BOOT_SWAP_USING_OFFSET=y / MOVE=n / SCRATCH=n / UPGRADE_ONLY=n），
# 强制文件优先级高于一切普通 fragment，所以即使接进去了也会被它盖掉。
#
# 直接证据：这里曾写过 CONFIG_MCUBOOT_LOG_LEVEL_INF=y，
# 而实际编出来的 mcuboot .config 是 CONFIG_MCUBOOT_LOG_LEVEL_OFF=y（soc fragment 的值）。
#
# 真正要改的开关在哪：
#   ① swap 模式（offset / move / scratch / upgrade-only）
#        → applications/esp32s3/s3_wifi_portal/sysbuild.conf
#          SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
#   ② mcuboot 自己的日志（要看到 swap 决策就必须开，验收完可关以省 ~20 KB）
#        → 只能在 mcuboot 侧配，sysbuild 没有对应 SB_CONFIG；
#          需要时用 -Dmcuboot_CONFIG_... 或直接改
#          zephyr_k/bootloader/mcuboot/boot/zephyr/socs/esp32s3_procpu.conf
#          注意它现在把日志关得很彻底（LOG_DEFAULT_LEVEL=0 + MCUBOOT_LOG_LEVEL_OFF）。
#   ③ 签名算法 / 密钥
#        → 也由 .config.sysbuild 强制：现在 BOOT_SIGNATURE_TYPE_RSA=y，
#          key = bootloader/mcuboot/root-rsa-2048.pem
