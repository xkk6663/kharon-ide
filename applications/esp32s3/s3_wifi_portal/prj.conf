# s3_wifi_portal —— Wi-Fi APSTA 配网门户
#
# 三层能力：APSTA（SoftAP + STA 共存）、HTTP server（配网页）、mDNS（s3portal.local）
# 加上 WS2812 呼吸灯做状态指示（红=未连接 / 蓝=连接中 / 绿=已连接）

# ---------- 基础 ----------
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# ---------- 镜像头版本：已移出 Kconfig，改由 tools\build_ota.ps1 构建后重签 ----------
# 历史做法是在这里写 CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--version=1.N.0"，
# 但 prj.conf 是 Kconfig 输入：每改一次版本就触发 reconfigure → 重新生成
# autoconf.h → 全树 .o 过期 → 整包全量重编（819 个文件，纯等待）。
# 现在版本唯一来源是 src/ota.h 的 OTA_LOCAL_VERSION，构建脚本用 imgtool
# 以真实版本重签 zephyr.bin（参数照抄 Zephyr 自己那条 sign 命令），
# 改版本只重编 ota.c/main.c 几个文件 + 一次 RSA 签名。
# 校验仍在：构建后 img_hdr.py 复查镜像头，不是 1.<OTA_LOCAL_VERSION>.0 就 exit 2。
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

# ---------- 网络基础 ----------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
# Captive Portal 三件套（缺一个手机就不会弹登录页）：
# 1) 把 AP 自己当成 DNS 发给手机，客户端 DNS 查询才会打到我们身上
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
# 2) DHCP option 114（RFC 8910）：直接告诉客户端门户地址（Android/Windows 认这个）
CONFIG_NET_DHCPV4_SERVER_OPTION_CAPTIVE_PORTAL=y
# 3) UDP:53 上的最小 DNS 劫持 + HTTP "/*" 302 由 main.c 实现
# AP 和 STA 各要一个 IPv4 地址，默认 1 个不够
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# ---------- DHCP 地址池（这里踩过一次"手机一直转圈"） ----------
# 默认地址池只有 4 个（CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4），
# 而 iOS/Android 每次"忘记网络再连"都会换一个随机 MAC（私有 Wi-Fi 地址），
# 每换一次 MAC 就占掉一个槽；再加上默认租约 86400 s（24 小时），
# 连几次之后池就满了 → 后续设备拿不到 IP → 手机卡在"正在获取 IP 地址"转圈。
# 所以：池扩到 16（192.168.4.10 ~ 192.168.4.25），租约缩到 900 s。
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=16
CONFIG_NET_DHCPV4_SERVER_ADDR_LEASE_TIME=900
# 地址冲突后默认封锁 24 小时，缩短到 120 s，避免一个坏地址长期占坑
CONFIG_NET_DHCPV4_SERVER_ADDR_DECLINE_TIME=120
# 分配前会先 ICMP probe 该地址，默认等 1000 ms；缩到 200 ms 让手机更快拿到 IP
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=200

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# ---------- 网络自检/调试 ----------
# 没有 NET_LOG 时 subsys/net 里的 LOG_ERR 会被整体编译掉，排错时看不到原因
CONFIG_NET_LOG=y
# net shell：串口里能跑 `net iface` / `net dns resolve s3portal.local` 自己验
CONFIG_NET_SHELL=y

# ---------- socket / 连接资源 ----------
# DHCPv4 server 依赖 socket service 线程，它把所有服务的 fd 汇总进一个 poll 数组，
# 数组大小就是 ZVFS_POLL_MAX（默认 3，本项目服务数 4 → 启动就报
# "You have 4 services to monitor but 3 poll entries configured" 并让线程失败）
CONFIG_ZVFS_POLL_MAX=16
# 连接上下文（net_context 池）：HTTP 监听+4 客户端 + DHCP(2) + mDNS + DNS 劫持 + 自检
# 默认 6 会被正好占满，第 7 个直接 net_context_get(): -2
CONFIG_NET_MAX_CONTEXTS=32
# TCP 连接表
# HTTP server（最多 4 个客户端）+ DHCP(2) + mDNS + 自检，默认 8 个连接上下文不够。
# 手机连上 AP 时 iOS/Android 会并发发多条 captive 探测，16 个会被瞬间占满
# （实测日志：net_conn: Not enough connection contexts -> net_tcp: Cannot allocate）
CONFIG_NET_MAX_CONN=32
# Wi-Fi 连接是在系统工作队列里跑的（net_mgmt → 驱动 → wpa_supplicant，调用很深），
# 默认 1024 会栈溢出，表现为切换线程时上下文损坏 / load prohibited 崩溃
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
# 栈保护哨兵：真溢出了会明确报 "stack overflow"，而不是随机崩溃
CONFIG_STACK_SENTINEL=y
# socket service 线程：DHCP server + DNS 劫持 + HTTP server + mDNS 的回调
# 全在这一个线程上跑。Kconfig 只有在启用 DHCP server 时才给 2400，
# 而我们把地址池从 4 扩到 16、又叠了通配 302 和 mDNS，
# 手机一连上 AP（DHCP + captive 探测并发）就栈溢出：
#   ** FATAL EXCEPTION / CPU 0 Invalid BSA / Current thread: net_socket_service
# 2400 → 8192，之后又叠了 SNTP / HTTP client 自检，仍偏紧 → 10240
# （Telnet 后端已于 2026-11 关闭，这项暂时不打算降回来：栈是按峰值配的，不是按平均值）
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=10240

# ---------- Wi-Fi ----------
CONFIG_WIFI=y
# AP+STA 共存要求 WIFI_NM（新版 Wi-Fi 管理层）与 usage mode
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
# 注意：ESP32_WIFI_SOFTAP_SUPPORT 没有提示符（由 AP 相关符号间接推导），
# 在 prj.conf 里硬写会直接报 "not directly user-configurable"。
CONFIG_WIFI_MGMT_AP_MAX_NUM_STA=8

# ---------- HTTP server ----------
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=y
# 只做 HTTP/1.1：关掉 HTTP/2、HTTP/3，省 flash 和 RAM
# CONFIG_HTTP_SERVER_VERSION_2 is not set
# CONFIG_HTTP_SERVER_VERSION_3 is not set
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
# 4096 → 6144：handler 里要拼 status JSON（含 ota 段和 boot 子对象），
# 还要做 Basic Auth 的 base64 解码，余量不够了
CONFIG_HTTP_SERVER_STACK_SIZE=6144
# 通配资源（"/*"）：所有非精确路径 302 回配网页，用来触发 Captive Portal 弹窗
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# ---------- mDNS ----------
CONFIG_MDNS_RESPONDER=y
# 打开解析器：板子自己也能反向查询（shell 里 `net dns resolve s3portal.local`
# 就能验证 responder 是否真的应答，不必等手机）
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y
CONFIG_NET_HOSTNAME_ENABLE=y
# 打开浏览器访问 http://s3portal.local 就靠这一行
CONFIG_NET_HOSTNAME="s3portal"

# ---------- RGB（WS2812 @ GPIO48，走 RMT） ----------
CONFIG_LED_STRIP=y

# ---------- 凭据持久化（NVS over settings） ----------
# 板级 dts 已自带 storage 分区（0x3b0000，192 KB），settings 会自动用它
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Zephyr 官方凭据库：SSID/密码交给它落盘（后端走 settings over NVS），
# 应用层不用再自己拼一张定长表塞进 settings_save_one()。
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=8
# 关掉库自带的"上电自动连接已存网络"：自动重连/退避/失败提示仍由本工程管理，
# 否则库里那套状态机会自己发起 CONNECT，和我们的 g_state 抢 STA。
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=n
CONFIG_WIFI_CREDENTIALS_SHELL=n

# ---------- 内存 ----------
# Wi-Fi 驱动自己要 51200 字节堆（HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI 会自动加），
# 这里给应用层存量：HTTP server + JSON 缓冲 + 扫描结果。
# 公网 OTA（mbedTLS + X.509）进来后 DRAM 曾溢出 22 KB：TLS 上下文/PSA 密钥槽
# 都是静态 .bss，改从这两处腾地方 —— 64K → 48K（TLS 握手时 x509 解析走堆，
# 实测峰值 < 10 KB；Wi-Fi 的 51200 是另一个独立加量，不受这里影响）。
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=4096

# ---------- OTA：mcuboot 双槽（sysbuild.conf 里开 SB_CONFIG_BOOTLOADER_MCUBOOT） ----------
# 这四个是 app 侧的最小组合：镜像管理器 + 往 slot1 流式写 + 增量擦除 + flash 回读校验
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# 攒块大小 = flash 最小擦写粒度（4 KB 的 1/8），512 是 Zephyr 默认，实测吞吐够
CONFIG_IMG_BLOCK_BUF_SIZE=512

# IMG_MANAGER 的硬依赖：STREAM_FLASH 是 menuconfig，默认**不开**，
# 不显式打开的话上面那串 IMG_* 会被 Kconfig 静默丢弃（.config 里一个都不出现）。
CONFIG_STREAM_FLASH=y
# sys_reboot()，OTA 成功切槽后自己要重启
CONFIG_REBOOT=y

# ---------- 远程 shell：只在局域网侧，走 HTTP ----------
# 曾经开过 CONFIG_SHELL_BACKEND_TELNET(:23)，2026-11 关掉。原因是页面按受众分离后，
# Telnet 成了唯一的漏口：Zephyr 这版 telnet backend 绑 0.0.0.0、没有来源过滤、
# 也没有认证钩子，手机连上热点就能拿到一个无口令的交互式 shell——与"面向用户的
# 只做配网"直接冲突。远程执行改由 POST /api/shell 承担（应用层能按 getpeername
# 判来源、能要 k=），Telnet 的价值只剩交互手感，不值得为它把整条 shell 敞开。
# 注：改这里会触发一次全量重编（Kconfig 输入变了），属一次性代价。
# CONFIG_SHELL_BACKEND_TELNET is not set

# ---------- SNTP 对时 ----------
# 拿到 STA IP 之后问一次时间，给网页显示本地时钟，也给 OTA 的时间新鲜度留出可能。
CONFIG_SNTP=y

# ---------- HTTP 客户端：联网自检 ----------
# 连上 AP、拿到 IP 之后主动 GET 一个外部地址，确认真的能出网
# （captive portal 最典型的坑是"连上了但出不去"，只有主动发一次请求才知道）。
CONFIG_HTTP_CLIENT=y

# ---------- Wi-Fi 省电：关掉 modem sleep（"无缘无故断连"的头号嫌疑） ----------
# drivers/wifi/esp32/Kconfig.esp32:420 的 choice 默认就是 MIN_MODEM：STA 每个 DTIM
# 才醒一次收 beacon。而本板是 APSTA 共存、只有一颗射频 —— AP 在发包、STA 又要睡，
# 典型表现就是大师说的那种"信号很好（-49 dBm）却无故掉线"。
# NONE = modem 不睡，代价是常驻电流上去（开发期完全可接受）。
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# BSS 空闲踢人阈值：默认 300 s。STA 睡着了路由器可能认为它不在线，
# 放宽到 600 s 给 modem sleep / 漫游留缓冲（即使以后又把省电开回来也不至于秒踢）。
CONFIG_WIFI_MGMT_BSS_MAX_IDLE_TIME=600

# ---------- 诊断能力（断连账本 / 栈水位 / 口令） ----------
# 注：CONFIG_HTTP_SERVER_CAPTURE_HEADERS 实测**不可用**——这版 Zephyr 的捕获状态
# 永远停在 NONE（全树只在 DROPPED 时改），populate_request_ctx() 于是恒把
# request_ctx->headers 置 NULL，任何基于请求头的鉴权都会恒放行。
# 所以鉴权改成应用层的 k= 查询参数（见 main.c auth_pass），这三行不再需要。
# CONFIG_HTTP_SERVER_CAPTURE_HEADERS is not set
# /api/boot 的线程栈水位：k_thread_foreach() 要 THREAD_MONITOR，
# k_thread_stack_space_get() 要 THREAD_STACK_INFO，缺一个就只剩空数组
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
# 实测 /api/boot 里最紧的一个就是 conn_mgr_monitor：512 B 的栈只剩 188 B。
# 它是处理网络事件回调的线程，真溢出会直接 FATAL 重启，给到 1024 留足余量。
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# 断连账本 / 栈水位 / 口令 相关配置见下方"诊断能力"。
# ---------- 网页内远程命令（POST /api/shell） ----------
# shell_dummy 是"出不进串口、把输出收进内存缓冲"的测试后端：
# HTTP 线程把命令交给它执行，再用 shell_backend_dummy_get_output() 取回文本。
# 缓冲给 2 KB：`kernel thread` 这类命令的输出就接近 1.5 KB，400 B 的默认值会截断。
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
# ---------- OTA S3：PSK + HMAC-SHA256 ----------
# 这版树里默认只开了 SHA-256（S2 整包摘要用）。HMAC 是独立的能力位：
# 不开的话 psa_mac_compute() 直接返回 PSA_ERROR_NOT_SUPPORTED，
# 现象是每次上传都被判 badauth，而日志里看不出"算法没编进去"。
# 代价约 4~6 KB flash，槽上限 1280 KB，当前镜像 853 KB，余量足够。
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# ---------- 公网 OTA（TLS 客户端，ota_cloud） ----------
# TLS socket：mbedTLS 拉进 + 凭据库放内嵌 CA（hub_ca.inc，证书固定）
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
# TLS1.2 协议栈本体：没它 MBEDTLS_SSL_CLI_C 不会进编译，sockets_tls 直接编译失败
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# sockets_tls 的会话缓存依赖 session tickets（不打开编译不过）
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y
# 密钥交换：ECDHE-RSA（服务器证书 RSA-2048），带前向保密；ECDSA 用不上
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y

# 具体 cipher suite —— 这一条才是"能用"的分界：
#   TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 会 select 整条依赖链：
#     TLS1.2 PRF（密钥推导，缺了握手必挂）/ RSA-PKCS1v15-SIGN + RSA-PSS（证书验签）
#     / ECDH / AES / GCM / RSA+ECC 密钥对 IMPORT·EXPORT·GENERATE
# 注意：PSA 的 `*_KEY_PAIR_BASIC` 是**无 prompt 的派生符号**（Kconfig.psa.logic
# 由 IMPORT/EXPORT/GENERATE/DERIVE 推导），在 prj.conf 里硬写会直接报
# "not directly user-configurable"；写上游符号即可。
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# PSA 密钥槽是**静态 .bss**：每槽 ~40 B + 最大非对称密钥长度（RSA-2048 私钥
# 约 600 B）。默认 16 槽纯属浪费，本工程同时最多用 3 把（TLS 客户端密钥、
# 服务器公钥、HMAC 的 PSK），给 4 槽：省下 ~10 KB DRAM。
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4

# P-256 曲线必须显式开：MBEDTLS_ECP_LIGHT 一被打开（上面 ECC 密钥对生成就会开），
# ecp.h 要求至少有一条 ECP_DP_* 曲线，否则 #error "Missing definition of
# MBEDTLS_ECP_MAX_BITS"。ciphersuite 里只是 imply，不够硬。
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# 内嵌的 hub CA 是 PEM（src/l0/hub_ca.inc）：不开 PEM 解析，mbedtls 会报
# -0x2180 (X509_INVALID_FORMAT)，表现为 "Failed to parse certificate on tag 1"。
CONFIG_MBEDTLS_PEM_PARSE_C=y
# OFFER JSON 解析（zephyr/data/json，静态描述符，无动态分配）
CONFIG_JSON_LIBRARY=y
