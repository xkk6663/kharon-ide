<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-S3 配网</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#0f1115;color:#e6e8ee;font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:19px;margin:2px 0 14px}
.card{background:#181b22;border:1px solid #262a34;border-radius:12px;padding:12px;margin-bottom:12px}
.hd{font-size:13px;color:#9aa3b2;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.st{font-size:16px;font-weight:600}
.sub{font-size:13px;color:#9aa3b2;margin-top:4px}
input{width:100%;padding:11px;margin-top:8px;border-radius:9px;border:1px solid #303543;background:#0f1115;color:#e6e8ee;font-size:16px}
button{font-size:15px;padding:10px 14px;border-radius:9px;border:0;background:#3b82f6;color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid #3b4250;color:#c8cdd8;font-weight:500;padding:7px 12px;font-size:13px}
button:disabled{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #232733}
.row:last-child{border-bottom:0}
.ssid{font-weight:600}
.meta{font-size:12px;color:#8b93a1}
.badge{font-size:11px;padding:1px 7px;border-radius:20px;background:#22304a;color:#8ab4ff;margin-left:6px}
.ok{background:#14351f;border-color:#1f5f36;color:#a6e3bd}
.err{background:#3a1a1e;border-color:#6c2630;color:#ffb4b4}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:13px;display:none}
.foot{font-size:12px;color:#6f7887;margin-top:6px;text-align:center}
</style>
</head>
<body>
<h1>ESP32-S3 配网</h1>

<div class="card">
  <div class="hd">当前网络</div>
  <div class="st" id="st">读取中…</div>
  <div class="sub" id="stsub">&nbsp;</div>
</div>

<div class="card">
  <div class="hd"><span>可用 WiFi</span><button class="ghost" id="scan">扫描</button></div>
  <div id="aps"><div class="meta">点“扫描”列出周围网络</div></div>
</div>

<div class="card">
  <div class="hd">已保存网络</div>
  <div id="saved"><div class="meta">读取中…</div></div>
</div>

<div class="card">
  <div class="hd">手动连接</div>
  <input id="ssid" placeholder="WiFi 名称" autocapitalize="off" autocorrect="off">
  <input id="psk" type="password" placeholder="密码（开放网络留空）">
  <div style="display:flex;gap:8px;margin-top:10px">
    <button id="go" style="flex:1">连接</button>
    <button class="ghost" id="disc">断开</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="foot">连上之后就可以关掉这一页了</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var SAVED = {}, LIST = [];

function esc(s) {
  return String(s).split('&').join('&amp;').split('<').join('&lt;')
    .split('>').join('&gt;').split('"').join('&quot;');
}

function fb(t, kind) {
  var m = $('msg');
  m.style.display = 'block';
  m.className = 'msg ' + (kind || '');
  m.textContent = t;
}

function fbclear() { $('msg').style.display = 'none'; }

function api(p) {
  return fetch(p).then(function (r) { return r.text(); }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) { throw new Error(t.slice(0, 80)); }
    return j;
  });
}

function renderSaved() {
  var h = '';
  for (var i = 0; i < LIST.length; i++) {
    var s = LIST[i];
    SAVED[s.ssid] = 1;
    h += "<div class='row'><span class='ssid'>" + esc(s.ssid);
    if (s.current) { h += "<span class='badge'>当前</span>"; }
    h += "</span><span><button class='ghost' data-c='" + i + "'>连接</button> ";
    h += "<button class='ghost' data-f='" + i + "'>忘记</button></span></div>";
  }
  $('saved').innerHTML = h || "<div class='meta'>还没有保存过，连上一个就会记住</div>";
}

function loadSaved() {
  return api('/api/saved').then(function (j) {
    LIST = j.saved || [];
    renderSaved();
  }).catch(function () {
    $('saved').innerHTML = "<div class='meta'>读取失败</div>";
  });
}

function status() {
  return api('/api/wifi').then(function (j) {
    if (j.state === 'connected') {
      $('st').textContent = '已连接 ' + j.ssid;
      $('stsub').textContent = j.ip + (j.rssi ? (' · 信号 ' + j.rssi + ' dBm') : '');
    } else if (j.state === 'connecting') {
      $('st').textContent = '正在连接…';
      $('stsub').textContent = j.msg || '';
    } else {
      $('st').textContent = '未连接';
      $('stsub').textContent = j.msg || '选一个网络并输入密码即可';
    }
    return j;
  }).catch(function () {
    $('st').textContent = '读取失败';
    $('stsub').textContent = '请重新打开 192.168.4.1';
  });
}

function scan() {
  var b = $('scan');
  b.disabled = true;
  b.textContent = '扫描中…';
  $('aps').innerHTML = "<div class='meta'>扫描中…</div>";
  fetch('/api/scan/start').catch(function () {});

  var n = 0;
  (function tick() {
    n++;
    api('/api/scan').then(function (j) {
      var aps = j.aps || [];
      if (aps.length || !j.scanning || n > 13) {
        var h = '';
        for (var i = 0; i < aps.length; i++) {
          var a = aps[i];
          h += "<div class='row' data-p='" + i + "'><span class='ssid'>" + esc(a.ssid) + "</span>";
          h += "<span class='meta'>" + a.rssi + " dBm";
          if (SAVED[a.ssid]) { h += ' · 已保存'; }
          h += "</span></div>";
        }
        window.__aps = aps;
        $('aps').innerHTML = h || "<div class='meta'>没扫到，靠近一点再试</div>";
        b.disabled = false;
        b.textContent = '扫描';
      } else {
        setTimeout(tick, 1200);
      }
    }).catch(function () { setTimeout(tick, 1200); });
  })();
}

function connect(ssid, psk) {
  var b = $('go'), old = b.textContent;
  b.disabled = true;
  b.textContent = '连接中…';
  fb('正在连接 ' + ssid + ' …（若手机 WiFi 短暂断开属正常）', '');

  var q = '/api/connect?ssid=' + encodeURIComponent(ssid);
  if (psk) { q += '&psk=' + encodeURIComponent(psk); }

  return api(q).then(function (j) {
    if (!j.ok) {
      fb('连接请求被拒绝：' + (j.err || '未知原因'), 'err');
      b.disabled = false;
      b.textContent = old;
      return false;
    }

    var last = '', got = false;

    var finish = function (ok, why) {
      if (ok) {
        fb('已连接 ' + ssid + '，可以关掉配网页了', 'ok');
      } else {
        fb('连接失败：' + (why || '等待超时') + '。常见原因：密码不对、信号太弱、路由器拒绝', 'err');
      }
      b.disabled = false;
      b.textContent = old;
      status();
      loadSaved();
    };

    var tick = function (i) {
      if (i > 13) { finish(got, last); return; }
      setTimeout(function () {
        status().then(function (st) {
          if (st.state === 'connected' && st.ssid === ssid) { got = true; finish(true, ''); return; }
          if (st.last_err) { last = st.last_err; } else if (st.msg) { last = st.msg; }
          tick(i + 1);
        }).catch(function () { tick(i + 1); });
      }, 1500);
    };

    tick(0);
  }).catch(function (e) {
    fb('请求失败：' + e, 'err');
    b.disabled = false;
    b.textContent = old;
  });
}

$('scan').onclick = scan;

$('go').onclick = function () {
  var s = $('ssid').value.trim();
  if (!s) { fb('请先选一个网络，或手动输入名称', 'err'); return; }
  fbclear();
  connect(s, $('psk').value);
};

$('disc').onclick = function () {
  api('/api/disconnect').then(function () {
    fb('已断开，板子回到热点模式', 'ok');
    status();
  }).catch(function (e) { fb('断开失败：' + e, 'err'); });
};

$('aps').onclick = function (e) {
  var r = e.target.closest('[data-p]');
  if (!r) { return; }
  var a = (window.__aps || [])[+r.getAttribute('data-p')];
  if (!a) { return; }
  $('ssid').value = a.ssid;
  $('psk').value = '';
  fbclear();
};

$('saved').onclick = function (e) {
  var b = e.target.closest('button');
  if (!b) { return; }
  var c = b.getAttribute('data-c'), f = b.getAttribute('data-f');
  if (c !== null) {
    var s = LIST[+c];
    if (s) { $('ssid').value = s.ssid; connect(s.ssid, ''); }
  }
  if (f !== null) {
    var d = LIST[+f];
    if (d && confirm('忘记 ' + d.ssid + ' ？')) {
      api('/api/forget?ssid=' + encodeURIComponent(d.ssid)).then(function () {
        fb('已忘记 ' + d.ssid, 'ok');
        loadSaved();
        status();
      });
    }
  }
};

status();
loadSaved();
setInterval(status, 3000);
</script>
</body>
</html>
