# sysbuild 侧配置（只影响"多镜像"这一层，不影响 app 自己的 prj.conf）
#
# 这块板（esp32s3_devkitc，4 MB flash）的分区表 partitions_0x0_amp_4M.dtsi
# 本来就带双槽：
#   mcuboot  @0x000000  64 KB
#   sys      @0x010000  64 KB
#   image-0  @0x020000  1344 KB   <- 当前运行槽
#   image-1  @0x170000  1344 KB   <- OTA 落盘槽
#   ...
#   storage  @0x3b0000  192 KB    <- NVS（凭据在这里，升级不动它）
# 所以 OTA 只需要"把 mcuboot 构建出来" + "app 挪到 0x20000"，不用自己画分区。
#
# 注意：这份分区表里**没有 scratch 分区**，所以 swap 方式只能是
# move / offset 这类二等分方案，不能用 swap-using-scratch。
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# swap 模式**在这一层决定**，不是 app 目录下的 mcuboot.conf。
# 实测证据（build/esp32s3/s3ota/mcuboot/zephyr/.config.sysbuild 由 sysbuild 强制写入）：
#   CONFIG_BOOT_SWAP_USING_OFFSET=y
#   CONFIG_BOOT_SWAP_USING_MOVE=n
#   CONFIG_BOOT_SWAP_USING_SCRATCH=n
# 原因是 sysbuild 自己的 choice MCUBOOT_MODE 默认就是 SWAP_USING_OFFSET
# （zephyr/share/sysbuild/images/bootloader/Kconfig:35），而 app 目录下的
# mcuboot.conf 根本没被加进 mcuboot 的 CONF_FILE 列表 —— 写在那里等于没写。
# 这里显式写一遍：值虽然和默认相同（行为不变），但以后换 Zephyr 树默认变了，
# 这里会把它钉住，不会悄悄变成别的模式。
#
# ---------- 2026-11-15 起改用 MOVE 模式（回滚实验的结论驱动） ----------
# 原来用 OFFSET 模式的代价实测出来了：
#   OFFSET 要求"升级槽里的镜像从槽首 +0x1000 开始"（第一个扇区留给 swap 记状态），
#   而 swap 完成后 mcuboot 把旧镜像放回 slot1 的 **+0**（实测 p0 有 magic、+4096 没有）。
#   于是这一份旧镜像**不是合法的升级镜像布局**：一旦对它 boot_request_upgrade() 打 pending，
#   bootloader 在 boot_validate_slot() 里判 secondary 无效，走 loader.c:655-660 的
#   boot_scramble_slot() 把整槽擦掉（实测 slot1 变成全 0xFFFFFFFF），然后 swap type 回 NONE。
#   结论：OFFSET 模式下"把旧槽标 pending 让它搬回来"这条回滚路是**不通**的。
# MOVE 模式没有那 4 KB 偏移，镜像在槽首，swap 来回都是同一种布局，pending 才有意义。
# 代价：MOVE 在槽内做数据搬移，比 OFFSET 慢一些，且要求两槽等大（本板就是等大的 1344 KB）。
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=n
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
