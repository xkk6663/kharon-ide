# projects/kharon/korvo_sys_s31.yaml
# 真·一 app 多板：applications/esp32s31/korvo_sys/boards 下同时有 s31 与 s3 的 overlay。
# 与 korvo_sys_s3 同属 matrix: korvo_sys —— 矩阵页按这个字段聚合对照。

name: korvo_sys_s31
root: ${ELAB_ROOT}/applications/esp32s31/korvo_sys
pack: zephyr/framework
chip: esp32s31_function_coreboard
archetype: zephyr
provider: zephyr/west@>=1 <2

build:
  kind: cmake
  source: ${root}/CMakeLists.txt
  work_dir: ${ELAB_ROOT}/build/esp32s31/korvo_sys/default

artifacts:
  elf: ${work_dir}/zephyr/zephyr.elf
  bin: ${work_dir}/zephyr/zephyr.bin
  hex: ${work_dir}/zephyr/zephyr.hex
  map: ${work_dir}/zephyr/zephyr.map

serial:
  port: auto
  baud: 115200
  reconnect: { enabled: true, min_ms: 200, max_ms: 5000, max_attempts: 0 }

monitor:
  fail_on:
    - { kind: regex, pattern: "FATAL ERROR|ASSERTION FAIL|Unhandled kernel exception" }
  idle_timeout_s: 30

matrix: korvo_sys
