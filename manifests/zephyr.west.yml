# manifests/zephyr.west.yml —— Zephyr 工作区**允许清单**（P1，2026-11-19）
#
# 事实来源：本机 `west list --format "{name}|{path}|{revision}"`（2026-11-19 实测）。
# 用途：
#   1. `kharon bootstrap --check` 用它判断"缺哪些 module"（离线可查）；
#   2. 依赖缓存 / 工作区分发只允许出现这里列出的项目；
#   3. 国内镜像只允许覆写 remote URL，**不允许改 revision**。
#
# 更新方式（升级 Zephyr 时）：先 `west update` 到目标 commit，再重新导出本文件，
# 与 `kharon deps` 的校验结果一起提交，保证 clone 后可复现同一棵工作区。
version: 1
zephyr:
  # west manifest 仓库（zephyr 本体）
  name: zephyr
  remote: https://github.com/zephyrproject-rtos/zephyr
  path: zephyr
  commit: 34e025569cbb27660b71db809627c3a7402e2111
  # 板级 module 的真相（不在 zephyr 树内另存副本）
  boards_module: zephyr_modules/elab-boards
  # `--pinned` 通道只拉这 6 个模块（与旧仓环境自举实测一致）；
  # `learning` 通道不看这份清单，直接 `west update` 全量。
  pinned_modules:
    - hal_espressif
    - hal_stm32
    - cmsis_6
    - mbedtls
    - tf-psa-crypto
    - mcuboot

